[package]
name = "binder-ai"
version = "0.1.2"
edition = "2021"
rust-version = "1.82"
authors = ["Binder contributors"]
license = "MIT"
description = "Binder AI orchestration: routing, prompts, tools, and task-oriented APIs over binder-llm"
repository = "https://github.com/dpkimball/binder-ai"
homepage = "https://github.com/dpkimball/binder-ai-releases"
readme = "README.md"
# Crate publish stays on the private Kellnr registry. Source consumers use the
# sibling path below. crates.io publication is a separate choice.
publish = ["dpk"]

[features]
default = ["all-providers", "intel"]
ollama = ["binder-llm/ollama"]
openai = ["binder-llm/openai"]
anthropic = ["binder-llm/anthropic"]
xai = ["binder-llm/xai"]
gemini = ["binder-llm/gemini"]
all-providers = ["ollama", "openai", "anthropic", "xai", "gemini"]
intel = ["dep:axum"]

[[bin]]
name = "binder-ai-plan"
path = "src/bin/binder_ai_plan.rs"

[[bin]]
name = "binder-ai-implement"
path = "src/bin/binder_ai_implement.rs"

[[bin]]
name = "binder-ai-serve"
path = "src/bin/binder_ai_serve.rs"
required-features = ["intel"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.7", optional = true }
base64 = "0.22"
binder-llm = { path = "../binder-llm", default-features = false }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "fs", "process", "time", "io-util"] }
tracing = "0.1"
git2 = { version = "0.20", default-features = false }
ignore = "0.4"
globset = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
