# Included by cargo-dist via dist-workspace.toml github-build-setup.
# Requires repo secrets PRIVATE_CARGO_URL (sparse index URL) and
# CARGO_REGISTRIES_DPK_TOKEN (or equivalent Kellnr publish/read token).
- name: Configure private Cargo registry (binder-llm)
  env:
    PRIVATE_CARGO_URL: ${{ secrets.PRIVATE_CARGO_URL }}
    CARGO_REGISTRIES_DPK_TOKEN: ${{ secrets.CARGO_REGISTRIES_DPK_TOKEN }}
  run: |
    set -euo pipefail
    if [ -z "${PRIVATE_CARGO_URL:-}" ]; then
      echo "PRIVATE_CARGO_URL secret is required for binder-ai release builds (binder-llm on Kellnr)" >&2
      exit 1
    fi
    mkdir -p "${HOME}/.cargo"
    {
      echo '[registries.dpk]'
      echo "index = \"${PRIVATE_CARGO_URL}\""
      echo 'credential-provider = ["cargo:token"]'
    } >> "${HOME}/.cargo/config.toml"
    if [ -n "${CARGO_REGISTRIES_DPK_TOKEN:-}" ]; then
      mkdir -p "${HOME}/.cargo"
      printf '[registries.dpk]\ntoken = "Cargo registry token %s"\n' \
        "${CARGO_REGISTRIES_DPK_TOKEN}" >> "${HOME}/.cargo/credentials.toml"
      chmod 600 "${HOME}/.cargo/credentials.toml"
    fi
