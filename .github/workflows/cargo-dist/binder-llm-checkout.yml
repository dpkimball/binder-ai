# Included by cargo-dist via dist-workspace.toml github-build-setup.
# binder-llm is a public path dependency.
- name: Checkout binder-llm as path dependency
  run: |
    set -euo pipefail
    DEST="${GITHUB_WORKSPACE}/../binder-llm"
    if [ ! -f "${DEST}/Cargo.toml" ]; then
      git clone --depth 1 "https://github.com/dpkimball/binder-llm.git" "${DEST}"
    fi
    test -f "${DEST}/Cargo.toml"
    python3 - <<'PY'
    from pathlib import Path
    p = Path("Cargo.toml")
    t = p.read_text()
    old = 'binder-llm = { version = "0.1.0", registry = "dpk", default-features = false }'
    new = 'binder-llm = { path = "../binder-llm", default-features = false }'
    if old not in t:
        if 'path = "../binder-llm"' in t:
            print("binder-llm already path-dependent")
        else:
            raise SystemExit("expected binder-llm registry dep not found in Cargo.toml")
    else:
        p.write_text(t.replace(old, new, 1))
        print("rewrote binder-llm dependency to path ../binder-llm")
    PY
