name: Image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: binder-ai-image-${{ github.ref }}
  cancel-in-progress: true

# Kellnr wiring matches binder-server deploy.yaml: configure-cargo-registry
# + cargo_idx (index as-is) + build-push-action. Host/port stay in
# PRIVATE_CARGO_URL. Destination differs (in-cluster registry, not GHCR).

jobs:
  docker:
    runs-on: product-ci
    timeout-minutes: 45
    outputs:
      short: ${{ steps.sha.outputs.short }}
    steps:
      - name: Reset self-hosted workspace
        shell: bash
        run: |
          set -euo pipefail
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@v4
        with:
          path: binder-ai

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/codeintel
          path: codeintel
          token: ${{ secrets.PAT_WORKFLOWGITACTION || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/bindb
          path: bindb
          token: ${{ secrets.PAT_WORKFLOWGITACTION || github.token }}

      - name: Configure Cargo registry dpk
        uses: dpkimball/dpk-ci/.github/actions/configure-cargo-registry@master
        with:
          cargo_url: ${{ secrets.PRIVATE_CARGO_URL }}

      - name: Cargo index for docker
        id: cargo_idx
        run: |
          set -euo pipefail
          test -n "${CARGO_REGISTRIES_DPK_INDEX:-}"
          echo "index=${CARGO_REGISTRIES_DPK_INDEX}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Host docker engine so tags/push hit localhost:30500 (QA registry).
          driver: docker

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: localhost:30500/binder-ai-serve
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./binder-ai
          file: ./binder-ai/Dockerfile
          build-args: |
            CARGO_REGISTRIES_DPK_INDEX=${{ steps.cargo_idx.outputs.index }}
          build-contexts: |
            bindb=./bindb
            codeintel=./codeintel
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          sbom: false

      - name: Export short SHA
        id: sha
        if: github.event_name != 'pull_request'
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  docker-ghcr:
    runs-on: product-ci
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Reset self-hosted workspace
        shell: bash
        run: find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@v4
        with:
          path: binder-ai

      - name: Configure Cargo registry dpk
        uses: dpkimball/dpk-ci/.github/actions/configure-cargo-registry@master
        with:
          cargo_url: ${{ secrets.PRIVATE_CARGO_URL }}

      - name: Cargo index for docker
        id: cargo_idx
        run: |
          set -euo pipefail
          test -n "${CARGO_REGISTRIES_DPK_INDEX:-}"
          echo "index=${CARGO_REGISTRIES_DPK_INDEX}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./binder-ai
          file: ./binder-ai/Dockerfile
          target: implement-artifacts
          build-args: |
            CARGO_REGISTRIES_DPK_INDEX=${{ steps.cargo_idx.outputs.index }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/binder-ai:latest
            ghcr.io/${{ github.repository_owner }}/binder-ai:${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=binder-ai-implement
          cache-to: type=gha,mode=max,scope=binder-ai-implement,ignore-error=true

  update-helm-values:
    needs: docker
    runs-on: product-ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      HELM_VALUES_PATH: charts/binder-ai-serve/values-qa.yaml
      SERVICE_NAME: binder-ai-serve
      TAG: sha-${{ needs.docker.outputs.short }}
    steps:
      - name: Checkout dpk-infra
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/dpk-infra
          token: ${{ secrets.PAT_WORKFLOWGITACTION }}
          path: infra

      - name: Verify yq
        run: |
          yq --version || (
            curl -sSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o yq &&
            chmod +x yq && ./yq --version
          )

      - name: Bump image tag in Helm values
        working-directory: infra
        env:
          VALUES: ${{ env.HELM_VALUES_PATH }}
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          test -f "$VALUES"
          YQ_CMD="yq"
          if ! command -v yq >/dev/null 2>&1; then
            YQ_CMD="../yq"
          fi
          $YQ_CMD -i '.image.tag = env(TAG)' "$VALUES"

      - name: Commit & push
        working-directory: infra
        env:
          SVC: ${{ env.SERVICE_NAME }}
          TAG: ${{ env.TAG }}
        run: |
          git config user.name  "Keepsake Bot"
          git config user.email "bot@keepsake.local"
          git add "$HELM_VALUES_PATH"
          git commit -m "ci(${SVC}): bump image to ${TAG}" || echo "No changes to commit"
          git push
