name: Image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: binder-ai-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: product-ci
    timeout-minutes: 45
    steps:
      - name: Reset self-hosted workspace
        shell: bash
        run: |
          set -euo pipefail
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@v4
        with:
          path: binder-ai

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/codeintel
          path: codeintel
          token: ${{ secrets.PAT_WORKFLOWGITACTION || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/bindb
          path: bindb
          token: ${{ secrets.PAT_WORKFLOWGITACTION || github.token }}

      - name: Configure Cargo registry dpk
        uses: dpkimball/dpk-ci/.github/actions/configure-cargo-registry@master
        with:
          cargo_url: ${{ secrets.PRIVATE_CARGO_URL }}

      - name: Build binder-ai-serve image
        working-directory: binder-ai
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA:0:7}"
          export DOCKER_BUILDKIT=1
          INDEX="${CARGO_REGISTRIES_DPK_INDEX:?}"
          # Linux Docker has no host.docker.internal unless we add it.
          # PRIVATE_CARGO_URL may be 127.0.0.1 (host) — rewrite for the build container.
          INDEX="${INDEX//127.0.0.1/host.docker.internal}"
          INDEX="${INDEX//localhost/host.docker.internal}"
          docker build \
            --add-host=host.docker.internal:host-gateway \
            --build-arg CARGO_REGISTRIES_DPK_INDEX="${INDEX}" \
            --build-context bindb=../bindb \
            --build-context codeintel=../codeintel \
            -t localhost:30500/binder-ai-serve:latest \
            -t "localhost:30500/binder-ai-serve:sha-${SHA}" \
            .

      - name: Push to QA registry
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA:0:7}"
          docker push localhost:30500/binder-ai-serve:latest
          docker push "localhost:30500/binder-ai-serve:sha-${SHA}"
