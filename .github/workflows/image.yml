name: Image

# Maintainer image build on product-ci. Not on pull_request: a fork must not
# reach that runner. Public checks are in ci.yml. The image builds from sibling
# path dependencies (bindb, codeintel, binder-llm) and does not call the private
# cargo registry. The helm bump at the bottom updates the private dpk-infra
# chart and runs only for maintainers.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: binder-ai-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: product-ci
    timeout-minutes: 45
    outputs:
      short: ${{ steps.sha.outputs.short }}
    steps:
      - name: Reset self-hosted workspace
        shell: bash
        run: |
          set -euo pipefail
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: binder-ai

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/codeintel
          path: codeintel

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/bindb
          path: bindb

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/binder-llm
          path: binder-llm

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # Host docker engine so tags/push hit localhost:30500 (QA registry).
          driver: docker

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: localhost:30500/binder-ai-serve
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest

      - name: Build image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./binder-ai
          file: ./binder-ai/Dockerfile
          build-contexts: |
            bindb=./bindb
            codeintel=./codeintel
            binder-llm=./binder-llm
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          sbom: false

      - name: Export short SHA
        id: sha
        if: github.event_name != 'pull_request'
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  docker-ghcr:
    runs-on: product-ci
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Reset self-hosted workspace
        shell: bash
        run: find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: binder-ai

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/binder-llm
          path: binder-llm

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./binder-ai
          file: ./binder-ai/Dockerfile
          target: implement-artifacts
          build-contexts: binder-llm=./binder-llm
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/binder-ai:latest
            ghcr.io/${{ github.repository_owner }}/binder-ai:${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=binder-ai-implement
          cache-to: type=gha,mode=max,scope=binder-ai-implement,ignore-error=true

  update-helm-values:
    needs: docker
    runs-on: product-ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      HELM_VALUES_PATH: charts/binder-ai-serve/values-qa.yaml
      SERVICE_NAME: binder-ai-serve
      TAG: sha-${{ needs.docker.outputs.short }}
    steps:
      - name: Checkout dpk-infra
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/dpk-infra
          token: ${{ secrets.PAT_WORKFLOWGITACTION }}
          path: infra

      - name: Verify yq
        run: |
          yq --version || (
            curl -sSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o yq &&
            chmod +x yq && ./yq --version
          )

      - name: Bump image tag in Helm values
        working-directory: infra
        env:
          VALUES: ${{ env.HELM_VALUES_PATH }}
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          test -f "$VALUES"
          YQ_CMD="yq"
          if ! command -v yq >/dev/null 2>&1; then
            YQ_CMD="../yq"
          fi
          $YQ_CMD -i '.image.tag = env(TAG)' "$VALUES"

      - name: Commit & push
        working-directory: infra
        env:
          SVC: ${{ env.SERVICE_NAME }}
          TAG: ${{ env.TAG }}
        run: |
          git config user.name  "Keepsake Bot"
          git config user.email "bot@keepsake.local"
          git add "$HELM_VALUES_PATH"
          git commit -m "ci(${SVC}): bump image to ${TAG}" || echo "No changes to commit"
          git push
