name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: binder-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Temporarily pinned until dpkimball/dpk-ci#267 merges (workspace reset).
    uses: dpkimball/dpk-ci/.github/workflows/rust-library-ci.yml@fix/rust-library-ci-workspace-reset
    with:
      project_name: binder-ai
      runner: product-ci
    secrets: inherit
