name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: binder-ai-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout binder-ai
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: binder-ai

      # Path dependency is ../binder-llm. binder-llm is public, so the default
      # token can read it, including on a fork pull request. The ref is a commit.
      - name: Checkout binder-llm
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: dpkimball/binder-llm
          ref: 294dd57e0eb2ea7dc6e1c77e95ad001f6fe7a054
          path: binder-llm
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            binder-ai/target
          key: ${{ runner.os }}-binder-ai-${{ hashFiles('binder-ai/Cargo.lock') }}

      - name: Format check
        working-directory: binder-ai
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: binder-ai
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: binder-ai
        run: cargo test --locked --all-features
