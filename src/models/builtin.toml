[task_defaults.summarization]
policy = "lowest_cost"
required = ["chat"]

[task_defaults.classification]
policy = "lowest_cost"
required = ["chat", "structured_output"]

[task_defaults.extraction]
policy = "lowest_cost"
required = ["chat", "structured_output"]

[task_defaults.planning]
policy = "balanced"
required = ["chat", "reasoning"]
min_quality = 3

[task_defaults.issue_planning]
policy = "balanced"
required = ["chat", "reasoning", "planning"]
min_quality = 3

[task_defaults.code_generation]
policy = "prefer_local"
required = ["chat", "coding"]
preferred_prefixes = ["qwen3-coder", "qwen"]
min_quality = 3

[task_defaults.refactoring]
policy = "prefer_local"
required = ["chat", "coding"]
preferred_prefixes = ["qwen3-coder", "qwen"]

[task_defaults.code_review]
policy = "prefer_local"
required = ["chat", "coding"]

[task_defaults.architecture_review]
policy = "best_quality"
required = ["chat", "reasoning"]
min_quality = 4

[task_defaults.reasoning]
policy = "balanced"
required = ["chat", "reasoning"]
min_quality = 3

[task_defaults.conversation]
policy = "balanced"
required = ["chat"]

[task_defaults.embedding]
policy = "prefer_local"
required = ["embeddings"]

[task_defaults.moderation]
policy = "lowest_cost"
required = ["chat", "structured_output"]
