# Builtin catalog. Routing matches capabilities and prefixes, not hardcoded model names.

[[profiles]]
provider = "ollama"
model_prefix = "qwen3-coder"
capabilities = { chat = true, coding = true, reasoning = true, planning = false, tools = true, structured_output = true, streaming = true, embeddings = false, vision = false, audio = false, long_context = false }
quality = { general = 4, coding = 5, reasoning = 4, tool_use = 4 }
cost_class = "free"

